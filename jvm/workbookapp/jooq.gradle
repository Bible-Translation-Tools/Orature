import groovy.sql.Sql

ext {
    sqlDirPath = [projectDir.path, "src", "main", "resources", "sql", "CreateAppDb.sql"].join(File.separator)
    sqliteFile = [projectDir.path, "test.sqlite"].join(File.separator)
    sqliteConnect = "jdbc:sqlite:${ext.sqliteFile}"
}

configurations {
    sqllite
}

dependencies {
    // Jooq
    implementation group: 'org.xerial', name: 'sqlite-jdbc', version: "$sqliteJdbcVer"
    implementation "org.jooq:jooq:$jooqVer"
    jooqGenerator group: 'org.jooq', name: 'jooq-meta-extensions', version: "$jooqVer"
    jooqGenerator "org.xerial:sqlite-jdbc:$sqliteJdbcVer"
    sqllite "org.xerial:sqlite-jdbc:$sqliteJdbcVer"
}

task createDb {
    boolean sandboxed = System.getenv("APP_SANDBOX_CONTAINER_ID") != null;
    boolean isMac = (System.getProperty("os.name")).toUpperCase().contains("MAC");

    if (sandboxed && isMac) {
            // Determine the current architecture
            String arch = System.getProperty("os.arch");
            String archDir;

            // Normalize architecture names
            if (arch.equals("aarch64")) {
                archDir = "mac/aarch64";
            } else if (arch.equals("x86_64") || arch.equals("amd64")) {
                archDir = "mac/x86_64";
            } else {
                throw new RuntimeException("Unsupported macOS architecture: " + arch);
            }

            // Locate the JAR file
            File jarFile = new File(NativeLibPathResolver.class
                .getProtectionDomain()
                .getCodeSource()
                .getLocation()
                .toURI());

        // Navigate to the appropriate native lib directory
        File nativeLibDir = new File(jarFile.getParentFile(), archDir);
        String absolutePath = nativeLibDir.getAbsolutePath();
        
        System.setProperty("jna.nosys", "true");
         // Don't unpack the libraries
        System.setProperty("jna.nounpack", "true");
        // Tell JNA where the native libraries are
        System.setProperty("jna.boot.library.path", absolutePath);
        // same path for sqlite
        // org.sqlite.lib.name=libsqlitejdbc.dylib passed a vm parameter. Path here in gradle due to needing arch
        System.setProperty("org.sqlite.lib.path", absolutePath);
    }
    //Add the full path to the sqlite-jdbc jar to the list of URLs
    //that Gradle will search for classes and resources
    //The code block below allows Gradle to find and use the executable jar for sqlite-jdbc
    //using its full path on the local machine
    URLClassLoader loader = GroovyObject.class.classLoader
    configurations.sqllite.each { File file ->
        loader.addURL(file.toURL())
    }
    String[] text = new File(sqlDirPath).text.split(';')
    text.collect { it.trim() }.findAll { !it.isEmpty() && !it.startsWith("--") }.each {
        def sql = Sql.newInstance(sqliteConnect, "org.sqlite.JDBC")
        sql.execute(it)
        if(!(System.getProperty("os.name")).toUpperCase().contains("MAC")) {
            sql.close()
        }
    }
}

jooq {
    version = "$jooqVer"

    configurations {
        main {  // name of the jOOQ configuration
            generateSchemaSourceOnCompilation = true  // default (can be omitted)

            generationTool {
                jdbc {
                    driver = 'org.sqlite.JDBC'
                    url = sqliteConnect
                }
                generator {
                    name = "org.jooq.codegen.DefaultGenerator"
                    database {
                        name = 'org.jooq.meta.sqlite.SQLiteDatabase'
                    }
                    generate {
                        deprecated = false
                        records = true
                        immutablePojos = true
                        fluentSetters = true
                    }
                    target {
                        packageName = 'jooq'
                        directory = 'src/main/java/jooq'
                    }
                    strategy.name = "org.jooq.codegen.DefaultGeneratorStrategy"
                }
            }
        }
    }
}

generateJooq.doFirst {
    project.file('src/main/java/jooq').deleteDir()
}

generateJooq.doLast {
    project.file(sqliteFile).delete()
}

generateJooq.dependsOn createDb
compileKotlin.dependsOn generateJooq