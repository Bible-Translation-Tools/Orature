import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent
import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'nu.studer.jooq' version "$jooqPluginVer"
    id 'org.openjfx.javafxplugin' version "$javafxPluginVer"
    id "com.install4j.gradle" version "$install4jPluginVer"
    id 'com.github.johnrengelman.shadow' version "$shadowPluginVer"
    id 'org.beryx.jlink' version "$jlinkPluginVer"
}
apply plugin: 'idea'

ext.jpmsModuleName = 'org.wycliffeassociates.otter.workbookapp'
ext.jpmsCompileJavaTaskName = 'compileJpmsJava'
ext.jpmsModulePathConfigurationName = 'runtimeClasspath'
ext.jpmsModulePathExcludeTokens = ['mockk', 'activation', 'batik-', 'xml-apis']
ext.jpmsPatchModuleDir = 'classes/java/main'
ext.jpmsCompileOutputDir = 'classes/jpms/main'

javafx {
    version = "$javafxVer"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

repositories {
    maven { url 'https://maven.ej-technologies.com/repository' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' } // TornadoFX 2.0 Snapshot
}

sourceSets {
    jpms {
        java {
            srcDir 'src/jpms/java'
        }
        compileClasspath += sourceSets.main.compileClasspath
    }
    assets {
        resources {
            srcDir "${project(':assets').projectDir}/src/main/resource"
        }
    }
    integrationTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integration-test/kotlin')
        }
        resources {
            srcDirs += [file('src/integration-test/resources'), assets.resources]
        }
    }
    main {
        resources {
            srcDirs += [assets.resources]
        }
    }
    test {
        resources {
            srcDirs += [assets.resources]
        }
    }
}

apply from: rootProject.file('gradle/jpms-kotlin.gradle')

tasks.named('classes') {
    dependsOn tasks.named('compileJpmsJava')
}
tasks.named('jar', Jar) {
    dependsOn tasks.named('compileJpmsJava')
    from(layout.buildDirectory.dir('classes/jpms/main')) {
        include 'module-info.class'
    }
}
tasks.named('compileJava', JavaCompile) {
    // Keep main Java compile non-modular; JPMS descriptor is compiled by compileJpmsJava.
    source = sourceSets.main.java
    // If a previous build wrote module-info.class into main output, javac switches to module mode.
    // Keep main compile classpath-based; module-info.class is provided later from classes/jpms/main.
    doFirst {
        delete(layout.buildDirectory.file('classes/java/main/module-info.class'))
    }
}

compileIntegrationTestKotlin {
    kotlinOptions.jvmTarget = "$javaVer"
}

configurations {
    integrationTestImplementation.extendsFrom main
    integrationTestRuntime.extendsFrom main
    javafxGridviewOriginal
}

// Keeps javax.xml / Xalan off the runtime graph so jlink merged module-info does not overlap `java.xml` or pull Xalan service providers.
configurations.named('runtimeClasspath') {
    exclude group: 'xalan', module: 'xalan'
    exclude group: 'xalan', module: 'serializer'
    exclude group: 'xml-apis', module: 'xml-apis'
    exclude group: 'xml-apis', module: 'xml-apis-ext'
}

// The published javafx-gridview JAR derives the same automatic module name as ControlsFX (split package / clash).
tasks.register('patchJavafxGridviewJar', Jar) {
    archiveFileName = 'javafx-gridview-patched.jar'
    destinationDirectory = layout.buildDirectory.dir('patched-modules').get().asFile
    from({
        zipTree(configurations.javafxGridviewOriginal.singleFile)
    }) {
        exclude 'module-info.class'
        exclude 'META-INF/versions/**/module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.WARN
    manifest {
        attributes('Automatic-Module-Name': 'org.wycliffeassociates.otter.javafx.gridview')
    }
}

application {
    mainModule = "org.wycliffeassociates.otter.workbookapp"
    mainClass = "org.wycliffeassociates.otter.jvm.workbookapp.MainKt"
    // The app's own modules (plus the jlink merged module holding TornadoFX and the other
    // automatic modules) use JavaFX internals; ALL-UNNAMED keeps class-path runs working.
    def internalsConsumers = 'org.wycliffeassociates.otter.workbookapp,' +
            'org.wycliffeassociates.otter.jvm.controls,' +
            'org.wycliffeassociates.merged.module,' +
            'ALL-UNNAMED'
    applicationDefaultJvmArgs = [
            '--add-modules=ALL-MODULE-PATH',
            "--add-exports=javafx.base/com.sun.javafx.logging=$internalsConsumers",
            "--add-exports=javafx.graphics/com.sun.javafx.application=$internalsConsumers",
            "--add-exports=javafx.graphics/com.sun.javafx.scene=$internalsConsumers",
            "--add-exports=javafx.graphics/com.sun.glass.ui=$internalsConsumers",
            "--add-exports=javafx.graphics/com.sun.javafx.scene.traversal=$internalsConsumers",
            "--add-exports=javafx.graphics/com.sun.javafx.util=$internalsConsumers",
            "--add-exports=javafx.controls/com.sun.javafx.scene.control.behavior=$internalsConsumers",
            "--add-exports=javafx.controls/com.sun.javafx.scene.control=$internalsConsumers",
            "--add-exports=javafx.base/com.sun.javafx.binding=$internalsConsumers",
            "--add-exports=javafx.graphics/com.sun.javafx.css=$internalsConsumers",
            "--add-opens=javafx.graphics/com.sun.javafx.scene=$internalsConsumers",
            "--add-opens=javafx.graphics/com.sun.glass.ui=$internalsConsumers",
            "--add-opens=javafx.graphics/com.sun.javafx.scene.traversal=$internalsConsumers",
            "--add-opens=javafx.graphics/com.sun.javafx.util=$internalsConsumers",
            "--add-opens=javafx.controls/com.sun.javafx.scene.control.behavior=$internalsConsumers",
            "--add-opens=javafx.controls/com.sun.javafx.scene.control=$internalsConsumers",
            "--add-opens=javafx.controls/javafx.scene.control.skin=$internalsConsumers",
            "--add-opens=javafx.base/com.sun.javafx.binding=$internalsConsumers",
            "--add-opens=javafx.graphics/com.sun.javafx.css=$internalsConsumers"
    ]
}

jlink {
    jvmVersion = javaVer as int
    moduleName = 'org.wycliffeassociates.otter.workbookapp'
    mainClass = 'org.wycliffeassociates.otter.jvm.workbookapp.MainKt'
    jarExclude('batik-ext', 'org/w3c/dom/**')
    addExtraDependencies('javafx', 'jfoenix')
    addOptions('--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages')

    launcher {
        name = 'orature'
    }

    jpackage {
        imageName = 'Orature'
        installerName = 'Orature'
        vendor = 'Wycliffe Associates'
        appVersion = (findProperty('appVersion') ?: findProperty('gradlewCommandVersionProp') ?: '0.0.0').toString()
        installerType = (findProperty('jpackageInstallerType') ?: {
            def os = org.gradle.internal.os.OperatingSystem.current()
            if (os.isWindows()) return 'msi'
            if (os.isMacOsX()) return 'dmg'
            'deb'
        }()).toString()
    }
}

tasks.register('buildWorkbookInstaller') {
    group = 'distribution'
    description = 'Runs jpackage to produce a native application installer (requires a JDK with jpackage).'
    dependsOn tasks.named('jpackage')
}

test {
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'testfx.headless', 'true'
    systemProperty 'prism.order', 'sw'
    systemProperty 'prism.text', 'native'
}

apply from: './jooq.gradle'

boolean devbuild = hasProperty("devbuild")

//install4j tasks for building win/nix/mac installers. Executable jar can be built without itv
install4j {
    vmParameters = ["-Dinstall4j.timestampUrl=http://timestamp.sectigo.com/", "-Xmx4096m"]

    faster = devbuild
    disableSigning = devbuild
    //pass in the install4j directory via -P if it's not in the default install location, e.q. for use with travis or arbitrary paths
    if (project.hasProperty('gradlewInstall4jDirectory')) {
        installDir = file(gradlewInstall4jDirectory)
    }
    //license must be passed via gradlew commandline -P as it can't be commit to public source control
    if (project.hasProperty('gradlewCommandLicenseProp')) {
        license = gradlewCommandLicenseProp
    }
    //gradle command Property for the maac code signing cert password
    if (project.hasProperty('gradlewmacKeystorePassword')) {
        macKeystorePassword = gradlewmacKeystorePassword
    }
}

task install4jdeploy(type: com.install4j.gradle.Install4jTask) {
    projectFile = 'otter.install4j'
    //Pass Build run # to install4j for versioning
    if (project.hasProperty('gradlewCommandVersionProp')) {
        release = gradlewCommandVersionProp
    }
    if (project.hasProperty('gradlewForMacAppStore')) {
        buildIds = [519]
    } else {
        buildIds = [60, 158, 415]
    }
}

def openjfxGraphicsClassifier = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    def arch = System.getProperty('os.arch')
    if (os.isWindows()) return 'win'
    if (os.isMacOsX()) return (arch == 'aarch64') ? 'mac-aarch64' : 'mac'
    if (arch == 'aarch64') return 'linux-aarch64'
    'linux'
}()

dependencies {
    javafxGridviewOriginal("org.wycliffeassociates:javafx-gridview:$javaGridviewVer") {
        transitive = false
    }

    // ReactiveX
    implementation "io.reactivex.rxjava2:rxkotlin:$rxkotlinVer"
    implementation "com.github.thomasnield:rxkotlinfx:$rxkotlinfxVer"
    implementation "com.jakewharton.rxrelay2:rxrelay:$rxrelayVer"

    // TornadoFX
    implementation "no.tornado:tornadofx2:$tornadofxVer"

    // Native OpenJFX libs for the host OS only (several classifiers on the same module break JPMS / jlink).
    runtimeOnly "org.openjfx:javafx-graphics:$javafxVer:$openjfxGraphicsClassifier"

    // SVG Loader
    implementation "com.github.jsarabia:FranzXaverSVG:$franzXaverSvgVer"

    // JFoenix
    implementation "com.jfoenix:jfoenix:$jfoenixVer"
    implementation "com.github.bkenn:kfoenix:$kfoenixVer"
    implementation "io.github.palexdev:materialfx:$materialFxVer"

    // ControlsFX (artifact comes transitively from :jvm:controls via `api` — avoids duplicate module on the jlink path)
    implementation files(layout.buildDirectory.file('patched-modules/javafx-gridview-patched.jar')) {
        builtBy patchJavafxGridviewJar
    }

    // Ikonli
    implementation "org.kordamp.ikonli:ikonli-javafx:$ikonliVer"
    implementation "org.kordamp.ikonli:ikonli-fontawesome-pack:$ikonliVer"
    implementation "org.kordamp.ikonli:ikonli-fontawesome5-pack:$ikonliVer"
    implementation "org.kordamp.ikonli:ikonli-materialdesign-pack:$ikonliVer"
    implementation "org.kordamp.ikonli:ikonli-material-pack:$ikonliVer"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofitVer"
    implementation "com.squareup.retrofit2:converter-jackson:$retrofitJacksonVer"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofitRxJava2Ver"

    // Jackson YAML
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:$jacksonVer"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jacksonVer"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-csv:$jacksonVer"

    //Dagger2
    implementation "com.google.dagger:dagger:$daggerVer"
    kapt "com.google.dagger:dagger-compiler:$daggerVer"
    kaptIntegrationTest "com.google.dagger:dagger-compiler:$daggerVer"

    // Testing
    compileOnly "io.mockk:mockk:$mockkVer"
    testImplementation "junit:junit:$junitVer"
    testImplementation "org.mockito:mockito-core:$mockitoVer"
    testImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:$mockitoKotlinVer"
    testImplementation "io.mockk:mockk:$mockkVer"
    testImplementation "org.testfx:testfx-core:$testFxVer"
    testImplementation "org.testfx:testfx-junit:$testFxVer"
    testImplementation "one.jpro:openjfx-monocle:$testFxMonocleVer"

    integrationTestImplementation "junit:junit:$junitVer"
    integrationTestImplementation "org.mockito:mockito-core:$mockitoVer"
    integrationTestImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:$mockitoKotlinVer"
    integrationTestImplementation "io.mockk:mockk:$mockkVer"
    integrationTestImplementation "org.testfx:testfx-core:$testFxVer"
    integrationTestImplementation "org.testfx:testfx-junit:$testFxVer"
    integrationTestImplementation "one.jpro:openjfx-monocle:$testFxMonocleVer"
    integrationTestImplementation group: 'junit', name: 'junit', version: "$junitVer"
    integrationTestImplementation "org.mockito:mockito-core:$mockitoVer"
    integrationTestImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:$mockitoKotlinVer"
    integrationTestImplementation files(sourceSets.main.compileClasspath)
    integrationTestImplementation files(sourceSets.main.runtimeClasspath)
    integrationTestImplementation sourceSets.main.output

    //WA Libraries
    implementation project(':assets')
    implementation project(':common')
    implementation project(':common:audio')
    implementation project(':jvm:controls')
    implementation project(':jvm:device')
    implementation project(':jvm:utils')
    implementation project(':jvm:workbookplugin')
    implementation "org.wycliffeassociates:kotlin-resource-container:$kotlinresourcecontainerVer"
    implementation "org.bibletranslationtools:kotlin-scripture-burrito:$kotlinscriptureburritoVer"
    implementation "org.bibletranslationtools:kotlin-scripture-alignment:$kotlinScriptureAlignmentVer"
    implementation "org.wycliffeassociates:usfmtools:$usfmToolsVer"
    testImplementation project(':common').sourceSets.test.output
    integrationTestImplementation project(':common').sourceSets.test.output // dependent on another project's test source

    // Atlassian commonmark (for rendering markdown)
    implementation "com.atlassian.commonmark:commonmark:$commonmarkVer"

    // jar loader
    implementation "org.clapper:javautil:$clapperJavaUtilVer"

    // Logging
    implementation "org.slf4j:slf4j-api:$slf4jApiVer"
    implementation "org.apache.logging.log4j:log4j-core:$log4j2Ver"
    implementation "org.apache.logging.log4j:log4j-slf4j18-impl:$log4j2Ver"

    // Sentry
    implementation "io.sentry:sentry:$sentryVer"

    implementation "com.github.Dansoftowner:jSystemThemeDetector:$systemThemeDectectorVer"
    implementation "com.install4j:install4j-runtime:$install4jVer"

    implementation "com.mpatric:mp3agic:$mp3TagVer"
    implementation "be.tarsos:tarsosdsp:$tarsosDspVer"

    implementation 'org.json:json:20230618'
}

// tell gradle what to put in the jar
shadowJar {
    archiveFileName = 'workbookapp.jar'
    mergeServiceFiles()
    manifest {
        attributes(
                'Main-Class': "org.wycliffeassociates.otter.jvm.workbookapp.MainKt"
        )
    }
}

kapt {
    correctErrorTypes true // https://stackoverflow.com/questions/45099688/error-error-nonexistentclass-kotlin-in-multi-module-dagger-project
}

// :jvm:controls compiles module-info in a dedicated jpms source set.
// KAPT reads controls classes output, so declare task ordering explicitly for Gradle 8 validation.
tasks.matching { it.name in ['kaptGenerateStubsKotlin', 'kaptKotlin', 'kaptGenerateStubsJpmsKotlin', 'kaptJpmsKotlin', 'kaptGenerateStubsIntegrationTestKotlin', 'kaptIntegrationTestKotlin'] }
        .configureEach {
            dependsOn(project(':jvm:controls').tasks.named('compileJpmsJava'))
        }

task integrationTest(type: Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    outputs.upToDateWhen { false }
    systemProperty "net.bytebuddy.experimental", "true" // https://github.com/raphw/byte-buddy/issues/1396#issuecomment-1405066509
}

configure(integrationTest) {
    group = 'verification'
    description = 'Cross-package and e2e tests, may require DB'
}

//////////////////////////////////// Custom Tasks ///////////////////////////////////////////
task createVersionProperties(dependsOn: processResources) {
    doLast {
        if (project.hasProperty('gradlewCommandVersionProp')) {
            new File("$buildDir/resources/main/version.properties").withWriter { w ->
                Properties p = new Properties()
                p['version'] = gradlewCommandVersionProp
                p.store w, null
            }
        }
    }
}

task createGithubProperties(dependsOn: processResources) {
    doLast {
        if (project.hasProperty('githubRepoUrl') && project.hasProperty('githubOauthToken')) {
            new File("$buildDir/resources/main/github.properties").withWriter { w ->
                Properties p = new Properties()
                p['repo-url'] = githubRepoUrl
                p['oauth-token'] = githubOauthToken
                p.store w, null
            }
        }
    }
}

task createSentryProperties(dependsOn: processResources) {
    doLast {
        if (project.hasProperty('sentryDsn')) {
            new File("$buildDir/resources/main/sentry.properties").withWriter { w ->
                Properties p = new Properties()
                p['dsn'] = sentryDsn
                p.store w, null
            }
        }
    }
}

task createLocalesProperties(dependsOn: processResources) {
    doLast {
        FileTree resources = fileTree("$buildDir/resources/main").matching {
            include "Messages_*"
        }

        new File("$buildDir/resources/main/languages.properties").withWriter { w ->
            Properties p = new Properties()
            resources.files.each {
                String name = it.name.replace(".properties", "").replace("Messages_", "")
                p[name] = ''
            }
            p.store w, null
        }
    }
}

task copyMessages(dependsOn: processResources, type: Copy) {
    from file("$buildDir/resources/main/Messages_en.properties")
    into "$buildDir/resources/main"
    rename { "Messages.properties" }
}

task copyTestResources(dependsOn: processResources, type: Copy) {
    from "$buildDir/resources/main"
    into "$buildDir/resources/test"
    include "*.properties"
}

///////////Customize Gradle Test Output ////////////////////////////////
tasks.withType(Test) {
    testLogging {
        // set options for log level LIFECYCLE
        events TestLogEvent.FAILED,
                TestLogEvent.PASSED,
                TestLogEvent.SKIPPED,
                TestLogEvent.STANDARD_OUT
        exceptionFormat TestExceptionFormat.FULL
        showExceptions true
        showCauses true
        showStackTraces true

        // set options for log level DEBUG and INFO
        debug {
            events TestLogEvent.STARTED,
                    TestLogEvent.FAILED,
                    TestLogEvent.PASSED,
                    TestLogEvent.SKIPPED,
                    TestLogEvent.STANDARD_ERROR,
                    TestLogEvent.STANDARD_OUT
            exceptionFormat TestExceptionFormat.FULL
        }
        info.events = debug.events
        info.exceptionFormat = debug.exceptionFormat

        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, " +
                        "${result.successfulTestCount} successes, " +
                        "${result.failedTestCount} failures, " +
                        "${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
            }
        }
    }
}

idea {
    module {
        generatedSourceDirs += file('build/generated/source/kapt/integrationTest')
    }
}

compileJava.dependsOn ':jvm:recorderapp:copyJarToWorkbookAppResources'
compileJava.dependsOn ':jvm:markerapp:copyJarToWorkbookAppResources'
compileJava.dependsOn createVersionProperties
compileJava.dependsOn createGithubProperties
compileJava.dependsOn createSentryProperties
compileJava.dependsOn createLocalesProperties
compileJava.dependsOn copyMessages
compileJava.dependsOn copyTestResources
processResources.dependsOn ':jvm:markerapp:copyJarToWorkbookAppResources'
processResources.dependsOn ':jvm:recorderapp:copyJarToWorkbookAppResources'
copyTestResources.dependsOn ':jvm:workbookapp:copyMessages'
distTar.dependsOn ':jvm:workbookapp:shadowJar'
distZip.dependsOn ':jvm:workbookapp:shadowJar'
startScripts.dependsOn ':jvm:workbookapp:shadowJar'
startShadowScripts.dependsOn ':jvm:workbookapp:jar'
shadowDistTar.dependsOn ':jvm:workbookapp:jar'
shadowDistZip.dependsOn ':jvm:workbookapp:jar'
integrationTest.shouldRunAfter test
integrationTest.dependsOn ':assets:build'
integrationTest.dependsOn ':assets:copyToResources'
check.dependsOn integrationTest
install4jdeploy.dependsOn build
install4jdeploy.dependsOn integrationTest
