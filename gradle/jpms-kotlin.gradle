import org.gradle.api.tasks.compile.JavaCompile

/**
 * Kotlin + module-info.java: Gradle places most compile classpath entries on the unnamed module path.
 * Force dependency modules (JARs and other Gradle project outputs) onto --module-path and patch in
 * Kotlin classes compiled to classes/java/main.
 */
String jpmsName = project.ext.jpmsModuleName
String javaCompileTaskName = project.ext.has('jpmsCompileJavaTaskName') ? project.ext.jpmsCompileJavaTaskName : 'compileJava'
String modulePathConfigurationName = project.ext.has('jpmsModulePathConfigurationName') ? project.ext.jpmsModulePathConfigurationName : 'compileClasspath'
List<String> modulePathExcludeTokens = project.ext.has('jpmsModulePathExcludeTokens') ? project.ext.jpmsModulePathExcludeTokens : []
String patchModuleDir = project.ext.has('jpmsPatchModuleDir') ? project.ext.jpmsPatchModuleDir : 'classes/java/main'
String jpmsCompileOutputDir = project.ext.has('jpmsCompileOutputDir') ? project.ext.jpmsCompileOutputDir : patchModuleDir

tasks.named('compileKotlin').configure {
    destinationDirectory.set(layout.buildDirectory.dir(patchModuleDir))
}

tasks.named(javaCompileTaskName, JavaCompile).configure {
    dependsOn tasks.named('compileKotlin')
    modularity.inferModulePath = false
    destinationDirectory.set(layout.buildDirectory.dir(jpmsCompileOutputDir))
    doFirst {
        JavaCompile jc = it as JavaCompile
        File outDir = layout.buildDirectory.dir(patchModuleDir).get().asFile
        String modulePath = configurations.getByName(modulePathConfigurationName).files
                .findAll { File f -> modulePathExcludeTokens.every { token -> !f.name.contains(token) } }
                .findAll { File f -> f.isDirectory() || f.name.endsWith('.jar') }
                .collect { it.absolutePath }
                .join(File.pathSeparator)

        jc.options.compilerArgs.addAll('--module-path', modulePath, '--patch-module', "$jpmsName=${outDir.absolutePath}")
        jc.classpath = files()
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
