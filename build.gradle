buildscript {
    apply from: './dependencies.gradle'

    repositories {
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVer"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:$ktlintPluginVer"
    }
}

plugins {
    id 'java'
    id 'jacoco' // test coverage report
    id 'nebula.lint' version "$nebulaLintPluginVer"
    id 'io.gitlab.arturbosch.detekt' version "$detektPluginVer"
    id "org.sonarqube" version "$sonarcloudPluginVer"
    id "com.github.hierynomus.license" version "$licensePluginVer"
}

apply plugin: 'io.gitlab.arturbosch.detekt'

repositories {
    maven { url "https://nexus-registry.walink.org/repository/maven-public/" }
}

jacoco {
    toolVersion = "$jacocoToolVer"
}

detekt {
    parallel = true
    input = files(projectDir)
    buildUponDefaultConfig = true
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt) {
    include("**/*.kt")
    include("**/*.kts")
    exclude("**/resources/**")
    exclude("**/build/**")
}

allprojects {
    apply plugin: "license"

    license {
        ignoreFailures = true
        header = rootProject.file("LICENSE")
        mapping {
            gradle = 'JAVADOC_STYLE'
            fxml = 'XML_STYLE'
        }
        includes(["**/*.kt", "**/*.java", "**/*.properties", "**/*.css", "**/*.fxml", "**/*.gradle"])
        excludes(["**/src/main/java/jooq/**/*.java", "**/*.sqlite"])
    }
}

subprojects {
    repositories {
        maven { url "https://nexus-registry.walink.org/repository/maven-public/" }
    }

    apply plugin: 'kotlin'
    apply plugin: 'kotlin-kapt'
    apply plugin: 'nebula.lint'
    apply plugin: 'org.jlleitschuh.gradle.ktlint'
    apply plugin: 'jacoco'

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVer"
    }

    ktlint {
        coloredOutput = false // Colors break source links in the IDEA console.
        ignoreFailures = true
    }

    group 'org.wycliffeassociates'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVer)
        }
        // Kotlin compilation stays on the classpath so optional JDK modules (e.g. TornadoFX -> java.json)
        // do not break the graph. Java compilation uses an explicit module path via gradle/jpms-kotlin.gradle.
        modularity.inferModulePath = false
    }

    compileKotlin {
        kotlinOptions.jvmTarget = "$javaVer"
    }

    compileTestKotlin {
        kotlinOptions.jvmTarget = "$javaVer"
    }

    gradleLint.rules = ['deprecated-dependency-configuration']

    configurations.configureEach { Configuration cfg ->
        cfg.withDependencies { DependencySet ds ->
            def torn = ds.findAll { d -> d instanceof ExternalDependency && d.group == 'no.tornado' && d.name == 'tornadofx2' }
            if (!torn.isEmpty()) {
                ds.removeAll(torn)
                ds.add(project.dependencies.create(project.files(rootProject.tasks.named('patchTornadofxJar').get().outputs.files.singleFile) {
                    builtBy rootProject.tasks.named('patchTornadofxJar')
                }))
            }
        }
    }
}

configurations {
    tornadofxUnpatched
}

dependencies {
    tornadofxUnpatched "no.tornado:tornadofx2:$tornadofxVer"
}

tasks.register('patchTornadofxJar', Jar) {
    dependsOn configurations.tornadofxUnpatched
    from { zipTree(configurations.tornadofxUnpatched.singleFile) }
    exclude '**/module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    duplicatesStrategy = DuplicatesStrategy.WARN
    archiveFileName = 'tornadofx2-patched.jar'
    destinationDirectory = layout.buildDirectory.dir('patched-modules').get().asFile
    manifest { attributes('Automatic-Module-Name': 'tornadofx') }
}