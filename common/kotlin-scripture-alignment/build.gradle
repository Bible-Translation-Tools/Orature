group = 'org.bibletranslationtools'
version = '1.3.2-demo'

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

    api "com.fasterxml.jackson.module:jackson-module-kotlin:2.15.1"
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.1'

    //implementation "org.bibletranslationtools:kotlin-vtt:1.0.0"
    implementation project(":common:kotlin-vtt")

    implementation "org.slf4j:slf4j-api:2.0.13"
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
    // Redirect test output to a file
    outputs.upToDateWhen { false } // Ensure tasks run always
    doFirst {
        delete "${buildDir}/test-results/test/test-output.txt"
    }
    maxParallelForks = 1
    systemProperty "kotlin.junit.jvm.disable.parameters.resolution", "true"
    systemProperty "java.util.logging.config.file", "${project.rootDir}/src/test/resources/logging.properties"
    // Capture stdout and stderr
    // The following lines will redirect the stdout to a file
    systemProperty "log.file", "${buildDir}/test-results/test/test-output.txt"
    testLogging.showStandardStreams = true
}
